# TrueNAS-side nginx server block for Storymaster.
#
# Place in /etc/nginx/conf.d/storymaster.conf (or wherever your TrueNAS
# nginx is configured to read from), then `nginx -t && systemctl reload nginx`.
#
# Architecture: Cloudflare Tunnel terminates the public TLS at the edge,
# pipes plaintext HTTP to cloudflared on this TrueNAS host, cloudflared
# routes the public hostname to this nginx server block (default port 80),
# nginx proxies across the LAN to the Rocky VM running the storymaster
# container on port 8765.
#
# The connections from Cloudflare → cloudflared → nginx → Rocky are all
# plaintext; that's expected since they're inside your network perimeter
# (or, in Cloudflare's case, inside their tunnel). Public TLS still
# terminates at the Cloudflare edge.

upstream storymaster_rocky {
    # ⚠️ Replace with the Rocky VM's LAN IP / hostname.
    server 192.168.x.y:8765 fail_timeout=0;
    keepalive 16;
}

server {
    # cloudflared connects locally; it's enough to listen on the loopback,
    # but listening on the LAN address works too if the Tunnel is configured
    # for a different host. 127.0.0.1 is the conservative default.
    listen 127.0.0.1:80;
    server_name storymaster.example.com;

    # Cloudflare passes the original visitor IP in CF-Connecting-IP. nginx's
    # access log uses $remote_addr (the cloudflared local connection); make
    # the original visitor visible too so log analysis is meaningful.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # Hard cap on uploaded JSON bodies. Storyweaver docs are markdown-sized;
    # raise this if you ever wire up the .storyweaver ZIP import path.
    client_max_body_size 10m;

    # Rate-limit the auth endpoint to slow brute-force attempts. The bucket
    # below permits ~10 req/s sustained per Cloudflare IP (i.e. per cloudflared
    # connection), with bursts of 20 absorbed without delay. Tune as needed.
    location = /api/auth/login {
        limit_req zone=storymaster_login burst=20 nodelay;
        proxy_pass http://storymaster_rocky;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://storymaster_rocky;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        # Long-poll-friendly. Uvicorn defaults are stricter; a slow upload
        # mid-request shouldn't get cut off.
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# Goes in the http {} block at the top of nginx.conf (or main include),
# not inside the server block above. Defined once per nginx instance:
#
#     http {
#         ...
#         limit_req_zone $binary_remote_addr zone=storymaster_login:10m rate=10r/s;
#     }
#
# 10m of memory holds ~160k tracked source IPs at any given time.
