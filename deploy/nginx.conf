# Storymaster nginx vhost.
#
# Drop into /etc/nginx/sites-available/storymaster and symlink into
# /etc/nginx/sites-enabled/. The TLS certificate / key paths assume
# Let's Encrypt; substitute as needed.
#
# Architecture: nginx terminates TLS, serves the SPA bundle from
# /opt/storymaster/web/dist, and reverse-proxies /api/* to the uvicorn
# unit on 127.0.0.1:8765 (see deploy/storymaster-api.service).

upstream storymaster_api {
    server 127.0.0.1:8765 fail_timeout=0;
    keepalive 16;
}

# Force HTTPS. Adjust certbot path if you serve from a different acme client.
server {
    listen 80;
    listen [::]:80;
    server_name storymaster.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name storymaster.example.com;

    ssl_certificate     /etc/letsencrypt/live/storymaster.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storymaster.example.com/privkey.pem;

    # Modern, conservative TLS. Update when intermediate roots change.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Common security headers. CSP intentionally permissive for the SPA's
    # inline styles + websocket-less app; tighten as you add features.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static SPA bundle. Long-cache hashed assets, no-cache index.html so
    # users get the new bundle the moment a deploy lands.
    root /opt/storymaster/web/dist;
    index index.html;

    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API + sync endpoints proxy to uvicorn. credentials=include cookies
    # work because the SPA and API share the origin.
    location /api/ {
        proxy_pass http://storymaster_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_redirect off;

        # Long-poll-friendly timeouts. Uvicorn defaults are stricter; pad
        # them so a slow client doesn't get cut off mid-upload.
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # SPA fallback: any non-/api path that isn't a static file resolves to
    # index.html so React Router handles the route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hard cap on uploaded JSON. Storyweaver docs are markdown-sized; if
    # you ever wire up the .storyweaver ZIP import path, raise this.
    client_max_body_size 10m;
}
